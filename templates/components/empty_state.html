<div class="rounded-2xl border border-dashed border-line bg-surface2 px-6 py-12 text-center {{ extra_class }}">
  <p class="font-display text-2xl">{{ title }}</p>
  <p class="mt-2 text-sm text-muted">{{ body }}</p>
  {% if action_label %}
  <div class="mt-5">
    <a href="{{ action_href }}" class="inline-flex rounded-xl bg-accent px-4 py-2 text-sm font-semibold text-onaccent">{{ action_label }}</a>
  </div>
  {% endif %}
</div>
