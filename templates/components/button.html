<button
  type="{{ type|default:'submit' }}"
  class="inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition
    {% if variant == 'ghost' %}border border-line bg-surface text-ink hover:bg-mutedbg
    {% elif variant == 'danger' %}bg-danger text-white hover:opacity-90
    {% else %}bg-accent text-onaccent hover:opacity-90 shadow-paper{% endif %}
    {{ extra_class }}"
  {{ attrs|default:'' }}
>
  {{ label }}
</button>
